<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Immich</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="home" class="screen">
  <div id="home-header"><span class="logo">Immich</span><span id="clock"></span></div>
  <div id="rows-viewport"><div id="rows"></div></div>
</div>

<div id="grid" class="screen hidden">
  <div id="grid-header"><span id="grid-title"></span><span id="grid-sub"></span>
    <div id="grid-btns"><span class="gbtn" id="btn-play">&#9654;&nbsp; Slideshow</span><span class="gbtn" id="btn-shuffle">&#8644;&nbsp; Shuffle</span></div>
  </div>
  <div id="grid-viewport"><div id="grid-canvas"></div></div>
</div>

<div id="viewer" class="screen hidden">
  <canvas id="v-bg-a" class="v-bg" width="120" height="68"></canvas>
  <canvas id="v-bg-b" class="v-bg" width="120" height="68"></canvas>
  <img id="v-img-a" class="v-img" alt="">
  <img id="v-img-b" class="v-img" alt="">
  <video id="v-video" class="hidden" preload="auto"></video>
  <div id="v-spinner" class="hidden"></div>
  <div id="v-bar" class="hidden"><span id="v-bar-left"></span><span id="v-bar-right"></span></div>
  <div id="v-info" class="hidden"></div>
  <div id="v-badge" class="hidden"></div>
</div>

<div id="toast" class="hidden"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
